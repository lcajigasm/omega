name: captures

# Records README and Pages media from the omega binary on this commit.
# workflow_dispatch regenerates them on demand. A release tag runs the same
# script and uploads the files; it does not publish them or move the tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]
  # One pull_request run records the files for this change. The trigger is
  # removed before merge so later PRs do not pay for a recording.
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install recorders
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core asciinema
          curl -fsSL -o /tmp/vhs.tar.gz https://github.com/charmbracelet/vhs/releases/download/v0.12.1/vhs_0.12.1_Linux_x86_64.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/vhs.tar.gz --strip-components=1 vhs_0.12.1_Linux_x86_64/vhs
          curl -fsSL -o /tmp/agg https://github.com/asciinema/agg/releases/download/v1.9.0/agg-x86_64-unknown-linux-gnu
          sudo install -m 755 /tmp/agg /usr/local/bin/agg
          curl -fsSL -o /tmp/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
          sudo install -m 755 /tmp/ttyd /usr/local/bin/ttyd
          vhs --version
          ttyd --version
          asciinema --version
          agg --version
      - name: record
        run: scripts/capture.sh
      - uses: actions/upload-artifact@v4
        with:
          name: captures
          path: |
            docs/assets/*.png
            docs/assets/*.gif
            docs/assets/*.cast
          if-no-files-found: error
