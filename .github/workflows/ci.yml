name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint
        if: runner.os == 'Linux'
        run: make lint
      - name: test
        run: go test ./...
      - name: build
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=ci" -o "omega${ext}" ./cmd/omega
          "./omega${ext}" --version
          "./omega${ext}" steps >/dev/null
          "./omega${ext}" config check
          "./omega${ext}" logs >/dev/null
      # Linux is a supported platform: run its own paths on a real machine.
      - name: linux steps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP/omega-config" XDG_STATE_HOME="$RUNNER_TEMP/omega-state" OMEGA_LANG=en
          ./omega steps | tee steps.txt
          # The Ubuntu catalogue: apt is detected, with the right risk.
          grep -Eq '✓ disk +read-only' steps.txt
          grep -Eq '✓ apt-outdated +read-only' steps.txt
          grep -Eq '✓ apt +dangerous' steps.txt
          grep -Eq '✓ apt-clean +dangerous' steps.txt
          grep -Eq '✓ apt-autoremove +dangerous' steps.txt
          grep -Eq '✓ journal-size +read-only' steps.txt
          grep -Eq '✓ journal-vacuum +dangerous' steps.txt
          grep -Eq ' trash +dangerous' steps.txt
          # Other distributions' managers are listed but not detected.
          grep -Eq '^    (dnf|pacman|zypper) +dangerous' steps.txt
          if grep -Eq '✓ (dnf|pacman|zypper) ' steps.txt; then echo "a package manager that is not installed shows as available"; exit 1; fi
          # Mac-only steps are not in the Linux catalogue at all.
          if grep -Eq ' (macos|macos-check|mas|brew-greedy|xcode-derived|simulators|mole-clean|mole-update) ' steps.txt; then
            echo "a Mac-only step is listed on Linux"; exit 1
          fi
          # Read-only steps run for real.
          ./omega steps run disk apt-outdated journal-size system-logs
          # A sudo step runs through omega's sudo bridge (the runner needs no password).
          ./omega steps run --yes apt-clean
          # The development inventory works with bash.
          ./omega dev status
          # omega mac says plainly that it is Mac-only.
          if out=$(./omega mac status 2>&1); then echo "omega mac ran on Linux"; exit 1; fi
          echo "$out" | grep -q 'only works on macOS'
      - name: linux key storage and doctor
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP/omega-keys" XDG_STATE_HOME="$RUNNER_TEMP/omega-state" OMEGA_LANG=en
          unset OPENAI_API_KEY
          mkdir -p "$XDG_CONFIG_HOME/omega"
          keys="$XDG_CONFIG_HOME/omega/keys"
          python3 scripts/mock_provider.py 18090 models &
          stub=$!
          trap 'kill "$stub" 2>/dev/null || true' EXIT
          for _ in $(seq 20); do
            python3 -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:18090/v1/models", timeout=1)' 2>/dev/null && break
            sleep 0.2
          done
          cat > "$XDG_CONFIG_HOME/omega/config.toml" <<'EOF'
          provider = "openai"
          language = "en"
          model = "omega-local-test"
          model_catalog = "off"

          [providers.openai]
          base_url = "http://127.0.0.1:18090/v1"
          EOF

          # No key yet: doctor fails and says where a key would go.
          if ./omega doctor > doctor.txt 2>&1; then cat doctor.txt; echo "doctor passed without a key"; exit 1; fi
          cat doctor.txt
          grep -q 'key: missing' doctor.txt
          grep -q 'key storage:' doctor.txt

          # Save a key. The runner has no keyring session, so it goes to the 0600 file, and omega says so.
          printf 'sk-ci-file-store-0123456789abcdef\n' | ./omega auth set openai | tee auth.txt
          grep -qF "$keys" auth.txt
          test "$(stat -c %a "$keys")" = 600
          ./omega auth status | tee status.txt
          grep -E 'openai +sk-ci-…cdef \(the file ' status.txt

          # Load it: doctor reads the key from the file and reaches the stub provider.
          ./omega doctor | tee doctor.txt
          grep -qF "key: ok (the file $keys" doctor.txt
          grep -q 'provider: reachable' doctor.txt

          # An environment variable takes precedence over the stored key.
          OPENAI_API_KEY=sk-ci-from-env-0123456789abcdef ./omega doctor | tee doctor-env.txt
          grep -q 'key: ok (an environment variable)' doctor-env.txt
          grep -q 'provider: reachable' doctor-env.txt

          # Delete it: the key is gone from the file.
          ./omega auth remove openai
          if grep -q '^openai=.' "$keys" 2>/dev/null; then echo "the key is still in the file"; exit 1; fi
          ./omega auth status | grep -E 'openai +—'
      # Windows is a supported platform: run its own paths on a real machine.
      - name: windows steps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:XDG_CONFIG_HOME = "$env:RUNNER_TEMP\omega-config"; $env:XDG_STATE_HOME = "$env:RUNNER_TEMP\omega-state"; $env:OMEGA_LANG = 'en'
          function Check($ok, $what) { if (-not $ok) { throw $what } }
          $steps = (./omega.exe steps | Out-String)
          $steps
          # The Windows catalogue, each step with the right risk.
          Check ($steps -match '✓ disk +read-only') 'disk is not listed as available'
          Check ($steps -match ' winget +dangerous') 'winget is not in the catalogue'
          Check ($steps -match ' scoop +normal') 'scoop is not in the catalogue'
          Check ($steps -match '✓ temp-files +dangerous') 'temp-files is not listed as available'
          Check ($steps -match '✓ recycle-bin +dangerous') 'the Recycle Bin step is not listed as available'
          Check ($steps -match '✓ system-logs +read-only') 'system-logs is not listed as available'
          # Nothing from macOS, Linux or a POSIX shell.
          Check (-not ($steps -match ' (macos|mas|brew|apt|dnf|journal-vacuum|xcode-derived|mole-clean|shell-startup|omz) ')) 'a step of another system is listed on Windows'
          # Read-only steps run for real, in PowerShell.
          $out = (./omega.exe steps run disk system-logs | Out-String); $out
          Check ($LASTEXITCODE -eq 0) 'the read-only steps failed'
          Check ($out -match 'DriveLetter') 'the disk step printed no drives'
          # A cleanup runs for real: the Recycle Bin of the runner.
          ./omega.exe steps run --yes recycle-bin
          Check ($LASTEXITCODE -eq 0) 'the Recycle Bin step failed'
          # The development inventory works without a Unix shell.
          ./omega.exe dev status
          Check ($LASTEXITCODE -eq 0) 'omega dev status failed'
          # omega mac says plainly that it is Mac-only.
          $ErrorActionPreference = 'Continue'
          $mac = (./omega.exe mac status 2>&1 | Out-String)
          Check ($LASTEXITCODE -ne 0) 'omega mac ran on Windows'
          Check ($mac -match 'only works on macOS') "omega mac did not say it is Mac-only: $mac"
          # The guided run lists its steps without a terminal only when told to run unattended.
          $full = (./omega.exe full 2>&1 | Out-String)
          Check ($LASTEXITCODE -ne 0) 'omega full ran without a terminal and without --yes'
          Check ($full -match '--yes') "omega full did not say how to run unattended: $full"
          exit 0
      - name: windows key storage and doctor
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:XDG_CONFIG_HOME = "$env:RUNNER_TEMP\omega-keys"; $env:XDG_STATE_HOME = "$env:RUNNER_TEMP\omega-state"; $env:OMEGA_LANG = 'en'
          Remove-Item Env:OPENAI_API_KEY -ErrorAction SilentlyContinue
          function Check($ok, $what) { if (-not $ok) { throw $what } }
          New-Item -ItemType Directory -Force "$env:XDG_CONFIG_HOME\omega" | Out-Null
          $stub = Start-Process python -ArgumentList 'scripts/mock_provider.py','18090','models' -PassThru -NoNewWindow
          try {
            foreach ($i in 1..30) { try { Invoke-WebRequest http://127.0.0.1:18090/v1/models -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Milliseconds 300 } }
            Set-Content "$env:XDG_CONFIG_HOME\omega\config.toml" "provider = `"openai`"`nlanguage = `"en`"`nmodel = `"omega-local-test`"`nmodel_catalog = `"off`"`n`n[providers.openai]`nbase_url = `"http://127.0.0.1:18090/v1`"`n"

            # No key yet: doctor fails and says where a key would go.
            $doc = (./omega.exe doctor 2>&1 | Out-String); $doc
            Check ($LASTEXITCODE -ne 0) 'doctor passed without a key'
            Check ($doc -match 'key: missing') 'doctor did not say the key is missing'
            Check ($doc -match 'Credential Manager') 'doctor did not name the Credential Manager'

            # Save a key: it goes to the Windows Credential Manager, and omega says so.
            $auth = ('sk-ci-credential-0123456789abcdef' | ./omega.exe auth set openai | Out-String); $auth
            Check ($LASTEXITCODE -eq 0) 'auth set failed'
            Check ($auth -match 'Credential Manager') 'auth set did not say where the key went'
            Check ((cmdkey /list | Out-String) -match 'omega-cli:openai') 'the credential is not in the Credential Manager'
            $status = (./omega.exe auth status | Out-String); $status
            Check ($status -match 'openai +sk-ci-…cdef') 'auth status does not show the saved key'

            # Load it: doctor reads the key back and reaches the stub provider.
            $doc = (./omega.exe doctor | Out-String); $doc
            Check ($doc -match 'key: ok \(the Windows Credential Manager\)') 'doctor did not read the key from the Credential Manager'
            Check ($doc -match 'provider: reachable') 'doctor did not reach the provider'

            # An environment variable takes precedence over the stored key.
            $env:OPENAI_API_KEY = 'sk-ci-from-env-0123456789abcdef'
            $doc = (./omega.exe doctor | Out-String)
            Check ($doc -match 'key: ok \(an environment variable\)') 'the environment variable did not win'
            Remove-Item Env:OPENAI_API_KEY

            # Delete it.
            ./omega.exe auth remove openai
            Check ($LASTEXITCODE -eq 0) 'auth remove failed'
            Check (-not ((cmdkey /list | Out-String) -match 'omega-cli:openai')) 'the credential is still there'
            Check ((./omega.exe auth status | Out-String) -match 'openai +—') 'auth status still shows a key'
          } finally { Stop-Process -Id $stub.Id -ErrorAction SilentlyContinue }
          exit 0
      # The winget ids of omega dev must exist. Not fatal: the runner may have no winget.
      - name: windows winget ids
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { Write-Output 'winget is not on this runner; ids not checked'; exit 0 }
          $bad = @()
          foreach ($id in (go run ./internal/devtools/cmd/wingetids)) {
            winget show --id $id --exact --accept-source-agreements --disable-interactivity | Out-Null
            if ($LASTEXITCODE -ne 0) { $bad += $id }
          }
          if ($bad.Count) { Write-Output "::warning::winget ids not found: $($bad -join ', ')"; exit 1 }
          Write-Output 'every winget id exists'
      - name: cross-compile
        if: runner.os == 'Linux'
        run: make cross
