name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint
        if: runner.os == 'Linux'
        run: make lint
      - name: test
        run: go test ./...
      - name: build
        shell: bash
        run: |
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=ci" -o "omega${ext}" ./cmd/omega
          "./omega${ext}" --version
          "./omega${ext}" steps >/dev/null
          "./omega${ext}" config check
          "./omega${ext}" logs >/dev/null
      - name: cross-compile
        if: runner.os == 'Linux'
        run: make cross
