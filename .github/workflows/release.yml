name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="omega_${ver}_${GOOS}_${GOARCH}"
          stage="$(mktemp -d)"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "${stage}/omega${ext}" ./cmd/omega
          cp LICENSE "${stage}/LICENSE"
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            (cd "$stage" && zip -q "${GITHUB_WORKSPACE}/dist/${name}.zip" "omega${ext}" LICENSE)
          else
            tar -C "$stage" -czf "dist/${name}.tar.gz" "omega${ext}" LICENSE
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: omega-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # The desktop app. macOS and Linux need the system webview's headers, so
  # each builds on its own runner; Windows needs no cgo and is cross-compiled.
  gui:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            arch: universal
            os: macos-latest
          - target: linux
            arch: amd64
            os: ubuntu-latest
          - target: linux
            arch: arm64
            os: ubuntu-24.04-arm
          - target: windows
            arch: amd64
            os: ubuntu-latest
          - target: windows
            arch: arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: disk image
        if: matrix.target == 'macos'
        run: scripts/package_macos.sh "$GITHUB_REF_NAME" dist
      - name: webview libraries
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: package
        if: matrix.target != 'macos'
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          name="omega-gui_${ver}_${TARGET}_${GOARCH}"
          stage="$(mktemp -d)"
          flags="-s -w -X main.version=${GITHUB_REF_NAME}"
          mkdir -p dist
          cp LICENSE "${stage}/LICENSE"
          if [ "$TARGET" = "windows" ]; then
            # -H windowsgui: no console window behind the app.
            GOOS=windows CGO_ENABLED=0 go build -trimpath -tags gui,production -ldflags "${flags} -H windowsgui" -o "${stage}/omega-gui.exe" ./cmd/omega-gui
            (cd "$stage" && zip -q "${GITHUB_WORKSPACE}/dist/${name}.zip" omega-gui.exe LICENSE)
          else
            GOOS=linux CGO_ENABLED=1 go build -trimpath -tags gui,production -ldflags "${flags}" -o "${stage}/omega-gui" ./cmd/omega-gui
            tar -C "$stage" -czf "dist/${name}.tar.gz" omega-gui LICENSE
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: omega-gui-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # The command as a container image on GitHub Packages:
  # ghcr.io/lcajigasm/omega, for linux/amd64 and linux/arm64. It waits for
  # the same builds as the release, so a tag that cannot be released leaves
  # no image behind. v1.2.3 is tagged 1.2.3, 1.2 and latest.
  image:
    needs: [build, gui]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The arm64 half of the image installs its packages under emulation;
      # the Go build is cross-compiled and does not need it.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        env:
          # On the image index too, where GitHub reads the description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=omega
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [build, gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: omega-*
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum omega_* omega-* > SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "omega ${GITHUB_REF_NAME#v}" \
            --generate-notes
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: formula
        # Record this tag's version and the sha256 of every archive in
        # Formula/omega.rb, and of the disk image in Casks/omega-app.rb, then
        # push that commit to main. The tag itself is left where it is: a
        # published release is never moved.
        #
        # The commit goes on top of main as it is now, not on top of the tag:
        # main may have moved while the builds ran (v0.17.0 waited on a macOS
        # runner, a pull request was merged meanwhile, and the push from the
        # tag was rejected, which left the formula, the cask and the tap on
        # the old version). The tool is built from the tag first, so the
        # release decides how the files are written.
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          go build -o "$RUNNER_TEMP/formula" ./internal/formula/cmd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach origin/main
            "$RUNNER_TEMP/formula" -version "$ver" -sums dist/SHA256SUMS -file Formula/omega.rb
            "$RUNNER_TEMP/formula" -version "$ver" -sums dist/SHA256SUMS -file Casks/omega-app.rb -cask
            git add Formula/omega.rb Casks/omega-app.rb
            if git diff --cached --quiet; then
              echo "formula already matches ${ver}"
              exit 0
            fi
            git commit -m "formula: omega ${ver}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during the push (attempt ${attempt}), trying again"
          done
          echo "::error::could not push the formula for ${ver} to main"
          exit 1
      - name: open homebrew tap pull request
        # HOMEBREW_TAP_TOKEN can push to lcajigasm/homebrew-tap and open a
        # pull request. It is not created here. When it is missing, say so
        # and fail verify-taps on the first check. A skipped step would let
        # the release look green while brew install stays on the old formula.
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set. The tap must be updated by hand: set the version and the sha256 for darwin_arm64, darwin_amd64, linux_arm64 and linux_amd64 in lcajigasm/homebrew-tap Formula/omega.rb. verify-taps fails until that formula matches this release."
            gh workflow run verify-taps.yml --ref main -f tag="$GITHUB_REF_NAME" -f fail_fast=true
            exit 1
          fi
          work="$(mktemp -d)"
          git clone --depth 1 https://github.com/lcajigasm/homebrew-tap.git "$work"
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base="$(git -C "$work" rev-parse --abbrev-ref HEAD)"
          branch="omega-${ver}"
          git -C "$work" checkout -B "$branch"
          "$RUNNER_TEMP/formula" -version "$ver" -sums dist/SHA256SUMS -file "$work/Formula/omega.rb" -tap
          # The cask in the tap is this repository's, as the step above left
          # it: this release's version and the sha256 of its disk image.
          mkdir -p "$work/Casks"
          cp Casks/omega-app.rb "$work/Casks/omega-app.rb"
          git -C "$work" add Formula/omega.rb Casks/omega-app.rb
          if git -C "$work" diff --cached --quiet; then
            echo "lcajigasm/homebrew-tap Formula/omega.rb and Casks/omega-app.rb already match ${ver}"
            exit 0
          fi
          git -C "$work" commit -m "omega ${ver}"
          remote_sha="$(git ls-remote --heads https://github.com/lcajigasm/homebrew-tap.git "refs/heads/${branch}" | awk '{print $1}')"
          export GH_TOKEN="$HOMEBREW_TAP_TOKEN"
          gh auth setup-git
          if [ -n "$remote_sha" ]; then
            git -C "$work" push --force-with-lease="refs/heads/${branch}:${remote_sha}" origin "HEAD:refs/heads/${branch}"
          else
            git -C "$work" push -u origin "HEAD:refs/heads/${branch}"
          fi
          if url="$(gh pr view --repo lcajigasm/homebrew-tap "$branch" --json url -q .url 2>/dev/null)"; then
            echo "updated ${url}"
            exit 0
          fi
          body="$(printf '%s\n' \
            "Update Formula/omega.rb and Casks/omega-app.rb to omega ${ver}." \
            "" \
            "The version is in the archive URLs. The sha256 values for darwin_arm64, darwin_amd64, linux_arm64 and linux_amd64 come from this release's SHA256SUMS." \
            "" \
            "Casks/omega-app.rb is the desktop app: its version and the sha256 of omega-macos-universal.dmg." \
            "" \
            "Opened by the omega release workflow. Merging publishes the formula that brew install lcajigasm/tap/omega installs and the cask that brew install --cask lcajigasm/tap/omega-app installs.")"
          gh pr create \
            --repo lcajigasm/homebrew-tap \
            --base "$base" \
            --head "$branch" \
            --title "omega ${ver}" \
            --body "$body"
      - name: start tap check
        # A release created with this token does not start other workflows.
        # verify-taps reads Formula/omega.rb from lcajigasm/homebrew-tap.
        # The pull request above has to be merged before this check can pass.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run verify-taps.yml --ref main -f tag="$GITHUB_REF_NAME"
