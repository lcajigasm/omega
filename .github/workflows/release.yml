name: release

# One click publishes a version: start this workflow from main (the Actions
# tab, or `gh workflow run release.yml -f bump=minor`) and it works out the
# next version, tests main, and publishes everything with a new tag: the
# archives, the desktop app, the container image, and the formula and cask
# in this repository and in lcajigasm/homebrew-tap.
#
# The builds do not wait for the tests: they start with them, on the same
# commit, so the macOS runner's queue overlaps the tests. Nothing is tagged
# or published until the tests and every build have passed: the tag is
# created together with the release, in the publish job. A release that
# fails or is cancelled earlier leaves no tag behind. (Three cancelled runs
# on 2026-11-11 left v0.20.0, v0.21.0 and v0.22.0, and the next patch
# release became v0.22.1.)
#
# Pushing a tag vX.Y.Z by hand still does the same for that tag.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: Or an exact version, like 1.2.3 (overrides the bump)
        type: string
        required: false
  push:
    tags: ["v*.*.*"]

# The tests and the builds run the repository's code and fetch its
# dependencies: they only read. The publish job is the one that writes, and
# says so itself.
permissions:
  contents: read

# Two releases at once would fight over the tag and over main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The tag this run publishes: the one that was pushed, or the next one
  # after the latest release.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::a release is started from main, not from ${GITHUB_REF_NAME}"
            exit 1
          fi
          tag="$(scripts/next_version.sh "${BUMP:-minor}" "${EXACT:-}")"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists"
            exit 1
          fi
          echo "releasing ${tag}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
      - run: go test ./...

  # Every build checks out the commit this run started on (GITHUB_SHA): the
  # pushed tag, or the commit of main that the publish job tags.
  build:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="omega_${ver}_${GOOS}_${GOARCH}"
          stage="$(mktemp -d)"
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "${stage}/omega${ext}" ./cmd/omega
          cp LICENSE "${stage}/LICENSE"
          mkdir -p dist
          if [ "$GOOS" = "windows" ]; then
            (cd "$stage" && zip -q "${GITHUB_WORKSPACE}/dist/${name}.zip" "omega${ext}" LICENSE)
          else
            tar -C "$stage" -czf "dist/${name}.tar.gz" "omega${ext}" LICENSE
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: omega-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # The desktop app. macOS and Linux need the system webview's headers, so
  # each builds on its own runner; Windows needs no cgo and is cross-compiled.
  gui:
    needs: version
    env:
      TAG: ${{ needs.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            arch: universal
            os: macos-latest
          - target: linux
            arch: amd64
            os: ubuntu-latest
          - target: linux
            arch: arm64
            os: ubuntu-24.04-arm
          - target: windows
            arch: amd64
            os: ubuntu-latest
          - target: windows
            arch: arm64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    # The macOS runner can wait in a queue; that wait does not count here.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: disk image
        if: matrix.target == 'macos'
        run: scripts/package_macos.sh "$TAG" dist
      - name: webview cache
        if: matrix.target == 'linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/webview-debs
          key: webview-debs-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}
          restore-keys: webview-debs-${{ runner.arch }}-${{ env.ImageOS }}-
      - name: webview libraries
        # A slow apt mirror once held this step for 45 minutes. The script
        # gives up on a dead mirror in seconds and retries; this is the cap.
        if: matrix.target == 'linux'
        timeout-minutes: 10
        run: scripts/install_webview_deps.sh ~/.cache/webview-debs
      - name: package
        if: matrix.target != 'macos'
        env:
          TARGET: ${{ matrix.target }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          name="omega-gui_${ver}_${TARGET}_${GOARCH}"
          stage="$(mktemp -d)"
          flags="-s -w -X main.version=${TAG}"
          mkdir -p dist
          cp LICENSE "${stage}/LICENSE"
          if [ "$TARGET" = "windows" ]; then
            # -H windowsgui: no console window behind the app.
            GOOS=windows CGO_ENABLED=0 go build -trimpath -tags gui,production -ldflags "${flags} -H windowsgui" -o "${stage}/omega-gui.exe" ./cmd/omega-gui
            (cd "$stage" && zip -q "${GITHUB_WORKSPACE}/dist/${name}.zip" omega-gui.exe LICENSE)
          else
            GOOS=linux CGO_ENABLED=1 go build -trimpath -tags gui,production -ldflags "${flags}" -o "${stage}/omega-gui" ./cmd/omega-gui
            tar -C "$stage" -czf "dist/${name}.tar.gz" omega-gui LICENSE
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: omega-gui-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # The command as a container image on GitHub Packages:
  # ghcr.io/lcajigasm/omega, for linux/amd64 and linux/arm64. It waits for
  # the release itself, so a version that could not be released leaves no
  # image behind (and no "latest" pointing at it). If the image fails, the
  # release is out and "Re-run failed jobs" builds the image again.
  # v1.2.3 is tagged 1.2.3, 1.2 and latest.
  image:
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      # GITHUB_SHA, the commit being released, which publish has tagged.
      - uses: actions/checkout@v7
      # The arm64 half of the image installs its packages under emulation;
      # the Go build is cross-compiled and does not need it.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        env:
          # On the image index too, where GitHub reads the description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.tag }}
          labels: |
            org.opencontainers.image.title=omega
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.version.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [version, test, build, gui]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Creates the tag and the release, pushes the formula to main and
    # starts the workflows that follow a release.
    permissions:
      contents: write
      actions: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: omega-*
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum omega_* omega-* > SHA256SUMS
      - name: publish
        # A release started by hand has no tag yet: gh creates it here, on
        # the commit that was tested and built, in the same call that
        # publishes the release. A tag created with the workflow's token
        # starts no second run. A pushed tag already exists and is used as is.
        #
        # This job can be run again after a later step failed (the push of
        # the formula, the tap): the release is then there already, and its
        # files are put again instead of failing on "already exists".
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "the release ${TAG} exists: uploading its files again"
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          target=()
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" dist/* "${target[@]}" \
            --title "omega ${TAG#v}" \
            --generate-notes
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: formula
        # Record this tag's version and the sha256 of every archive in
        # Formula/omega.rb, and of the disk image in Casks/omega-app.rb, then
        # push that commit to main. The tag itself is left where it is: a
        # published release is never moved.
        #
        # The commit goes on top of main as it is now, not on top of the tag:
        # main may have moved while the builds ran (v0.17.0 waited on a macOS
        # runner, a pull request was merged meanwhile, and the push from the
        # tag was rejected, which left the formula, the cask and the tap on
        # the old version). The tool is built from the tag first, so the
        # release decides how the files are written.
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          go build -o "$RUNNER_TEMP/formula" ./internal/formula/cmd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout --detach origin/main
            "$RUNNER_TEMP/formula" -version "$ver" -sums dist/SHA256SUMS -file Formula/omega.rb
            "$RUNNER_TEMP/formula" -version "$ver" -sums dist/SHA256SUMS -file Casks/omega-app.rb -cask
            git add Formula/omega.rb Casks/omega-app.rb
            if git diff --cached --quiet; then
              echo "formula already matches ${ver}"
              exit 0
            fi
            git commit -m "formula: omega ${ver}"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during the push (attempt ${attempt}), trying again"
          done
          echo "::error::could not push the formula for ${ver} to main"
          exit 1
      - name: update the tap
        # brew install reads lcajigasm/homebrew-tap, which rewrites its own
        # Formula/omega.rb and Casks/omega-app.rb from this repository's
        # latest release (script/update_tap.py there). Its schedule asks for
        # a run every 15 minutes, but GitHub delays and drops those events:
        # on 2026-11-11 a whole day had six. So when HOMEBREW_TAP_TOKEN is
        # set (a fine-grained token on lcajigasm/homebrew-tap with Actions
        # and Contents read and write), the release starts that update now,
        # waits for it, and checks that brew sees this version. The release
        # then ends with the tap up to date, a minute or two after the tag.
        #
        # Without the token the release is still complete: the tap follows
        # on a scheduled run, and verify-taps (started below) waits for it.
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: lcajigasm/homebrew-tap picks ${TAG} up on its next scheduled run, which GitHub may delay by an hour or more. verify-taps waits for it."
            exit 0
          fi
          export GH_TOKEN="$HOMEBREW_TAP_TOKEN"
          tap=lcajigasm/homebrew-tap
          since="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run update.yml --repo "$tap" --ref main
          run=""
          for _ in $(seq 30); do
            run="$(gh run list --repo "$tap" --workflow update.yml --event workflow_dispatch --limit 5 \
              --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$since\")][-1].databaseId // empty")"
            [ -n "$run" ] && break
            sleep 2
          done
          if [ -z "$run" ]; then
            echo "::error::the update on ${tap} did not start"
            exit 1
          fi
          echo "waiting for https://github.com/${tap}/actions/runs/${run}"
          # The tap updates other programs too: one of them failing turns
          # its run red without touching omega. What counts is what brew
          # reads, checked right after.
          gh run watch "$run" --repo "$tap" --interval 5 || true
          # The contents API may answer from a cache for a minute or so.
          python3 scripts/verify_taps.py "$TAG" --interval 15 --deadline 180
          echo "brew install lcajigasm/tap/omega installs ${TAG#v}" >> "$GITHUB_STEP_SUMMARY"
          echo "tap_done=true" >> "$GITHUB_ENV"
      - name: start the captures
        # The captures workflow records the README media on a pushed tag. A
        # tag created by this workflow's token starts nothing, so it is
        # started here. It only uploads files: a failure to start it does
        # not undo a release.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run captures.yml --ref "$TAG" || echo "::warning::the captures workflow did not start for ${TAG}"
      - name: start tap check
        # Only when the tap was not updated above. A release created with
        # this token does not start other workflows. verify-taps reads the
        # formula and the cask from the tap until both are this version, and
        # fails the run if they never get there.
        if: env.tap_done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run verify-taps.yml --ref main -f tag="$TAG"
