name: verify-taps

# After a release, Formula/omega.rb and Casks/omega-app.rb on
# lcajigasm/homebrew-tap must match the tag. This job reads both from the
# public API, with no token, and fails if either is still not the tag. fail_fast checks once: the release job uses it
# when HOMEBREW_TAP_TOKEN is absent, so the miss is a red run immediately
# instead of a 75 minute wait on a cron that may not run.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check, for example v0.10.0
        required: true
        type: string
      fail_fast:
        description: Check once and fail if the tap formula is not this tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: check lcajigasm/homebrew-tap
        env:
          # release: published carries the tag. workflow_dispatch passes it in.
          VERIFY_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          FAIL_FAST: ${{ inputs.fail_fast == true }}
        run: |
          set -euo pipefail
          if [ "$FAIL_FAST" = "true" ]; then
            python3 scripts/verify_taps.py "$VERIFY_TAG" --deadline 0
          else
            python3 scripts/verify_taps.py "$VERIFY_TAG"
          fi
