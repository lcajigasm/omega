name: verify-taps

# After a release, Formula/omega.rb and Casks/omega-app.rb on
# lcajigasm/homebrew-tap must match the tag. The tap rewrites both by itself
# from this repository's latest release. This job reads them from the public
# API, with no token, every 5 minutes for up to 75 minutes, and fails if
# either is still not the tag. fail_fast checks once.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check, for example v0.10.0
        required: true
        type: string
      fail_fast:
        description: Check once and fail if the tap formula is not this tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: check lcajigasm/homebrew-tap
        env:
          # release: published carries the tag. workflow_dispatch passes it in.
          VERIFY_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          FAIL_FAST: ${{ inputs.fail_fast == true }}
          # The tap is public; the token only lifts the API's limit for
          # requests without one, which a shared runner address runs out of.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$FAIL_FAST" = "true" ]; then
            python3 scripts/verify_taps.py "$VERIFY_TAG" --deadline 0
          else
            python3 scripts/verify_taps.py "$VERIFY_TAG"
          fi
