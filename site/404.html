<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{t "notfound.title"}}</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/omega/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
  <script>(function(){try{var t=localStorage.getItem("omega-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/omega/styles.css?v=20">
</head>
<body class="page">
  <a class="skip" href="#main" data-k="page.1">{{t "page.1"}}</a>
  <main id="main">
    <p class="notfound"><b>✗ exit 404</b> <span data-k="notfound.cmd">{{t "notfound.cmd"}}</span><br><span>│ </span><span data-k="notfound.err">{{t "notfound.err"}}</span></p>
      <h1 data-k="notfound.heading">{{t "notfound.heading"}}</h1>
      <p data-k="notfound.body">{{t "notfound.body"}}</p>
      <a class="btn btn-ink" href="/omega/" id="home" data-k="privacy.back">{{t "privacy.back"}}</a>
  </main>
  <!-- GitHub Pages serves this one file for every missing address, so the
       language comes from the address, then from the visitor. -->
  <script>
  (function () {
    var all = {{all "page.1" "notfound.title" "notfound.cmd" "notfound.err" "notfound.heading" "notfound.body" "privacy.back"}};
    var m = location.pathname.match(/^\/omega\/([a-z]{2})(\/|$)/), lang = m && m[1];
    try {
      if (!all[lang]) lang = (localStorage.getItem("omega-lang") || navigator.language || "").slice(0, 2).toLowerCase();
    } catch (e) {}
    var strings = all[lang];
    if (!strings) return;
    document.documentElement.lang = lang;
    document.title = strings["notfound.title"];
    document.querySelectorAll("[data-k]").forEach(function (el) { el.innerHTML = strings[el.getAttribute("data-k")]; });
    document.getElementById("home").href = "/omega/" + lang + "/";
  })();
  </script>
</body>
</html>
